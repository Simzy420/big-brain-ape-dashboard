<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sims Construction — Work Orders</title>
<style>
body { margin:0; background:#0f0f17; color:#fff; font-family:-apple-system,sans-serif; }
header { padding:16px; background:linear-gradient(135deg,#0099ff,#00cc66); position:sticky; top:0; }
h1 { margin:0; font-size:24px; }
.tabs { display:flex; gap:8px; overflow:auto; padding:12px; }
.tab { background:#1c1c2e; border:0; color:#fff; border-radius:12px; padding:12px 14px; font-size:18px; font-weight:700; }
.wrap { padding:12px; }
.card { background:#1c1c2e; border-radius:16px; padding:16px; margin-bottom:12px; }
button.big { width:100%; border:0; border-radius:12px; padding:16px; font-size:22px; font-weight:800; color:#fff; margin-top:8px; }
.accept { background:#00cc66; }
.decline { background:#ff3b30; }
.save { background:#0099ff; }
input { width:100%; box-sizing:border-box; font-size:20px; padding:14px; border-radius:12px; border:0; }
.muted { color:#aaa; font-size:16px; }
</style>
</head>
<body>
<header><h1>Sims Construction</h1><p>Work orders</p></header>
<div class="tabs">
  <button class="tab" onclick="show('inbox')">Inbox <span id="inboxCount">0</span></button>
  <button class="tab" onclick="show('accepted')">Accepted <span id="acceptedCount">0</span></button>
  <button class="tab" onclick="show('settings')">Settings</button>
</div>
<div class="wrap">
  <div id="inbox"></div>
  <div id="accepted" style="display:none"></div>
  <div id="settings" style="display:none">
    <div class="card">
      <p class="muted">Paste the GitHub token once. It stays on this phone.</p>
      <input id="token" type="password" placeholder="ghp_...">
      <button class="big save" onclick="saveToken()">Save Token</button>
      <p id="status" class="muted"></p>
    </div>
  </div>
</div>
<script>
function getData(k){ try { return JSON.parse(localStorage.getItem(k)||'[]'); } catch(e){ return []; } }
function saveData(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function handled(){
  const nums = new Set();
  ['corrigo_inbox','corrigo_accepted','corrigo_declined'].forEach(k => getData(k).forEach(w => nums.add(String(w.number))));
  return nums;
}
function show(name){
  ['inbox','accepted','settings'].forEach(id => document.getElementById(id).style.display = id===name ? 'block' : 'none');
  if (name==='inbox') render();
  if (name==='accepted') render();
}
function render(){
  const inbox = getData('corrigo_inbox');
  const accepted = getData('corrigo_accepted');
  document.getElementById('inboxCount').textContent = inbox.length;
  document.getElementById('acceptedCount').textContent = accepted.length;
  document.getElementById('inbox').innerHTML = inbox.map(w => card(w,true)).join('') || '<div class="card">No jobs in inbox.</div>';
  document.getElementById('accepted').innerHTML = accepted.map(w => card(w,false)).join('') || '<div class="card">Nothing accepted yet.</div>';
  const token = localStorage.getItem('github_token');
  document.getElementById('status').textContent = token ? 'Token saved on this phone.' : 'No token saved yet.';
}
function card(w, canAct){
  const buttons = canAct ? `<button class="big accept" onclick="choose('${w.id}','accept')">Accept</button><button class="big decline" onclick="choose('${w.id}','decline')">Decline</button>` : '<p class="muted">Waiting for Corrigo pickup</p>';
  return `<div class="card"><strong>${w.number||''}</strong><p>${w.location||''}</p><p>${w.description||''}</p>${buttons}</div>`;
}
function choose(id, action){
  let inbox = getData('corrigo_inbox');
  const idx = inbox.findIndex(w => w.id===id);
  if (idx<0) return;
  const wo = inbox[idx];
  wo.status = action==='accept' ? 'accepted' : 'declined';
  inbox.splice(idx,1);
  saveData('corrigo_inbox', inbox);
  const key = action==='accept' ? 'corrigo_accepted' : 'corrigo_declined';
  const arr = getData(key);
  arr.unshift(wo);
  saveData(key, arr);
  render();
  show(action==='accept' ? 'accepted' : 'inbox');
  sendPickup();
}
async function sendPickup(){
  const token = localStorage.getItem('github_token');
  if (!token) { alert('Saved on this phone. Paste the token in Settings so it can be picked up.'); return; }
  const actions = [];
  getData('corrigo_accepted').forEach(w => actions.push({number:w.number, action:'accept', location:w.location||'', description:w.description||''}));
  getData('corrigo_declined').forEach(w => actions.push({number:w.number, action:'decline', location:w.location||'', description:w.description||''}));
  const body = { message:'Pickup from phone app', content: btoa(unescape(encodeURIComponent(JSON.stringify({pendingActions:actions, exportedAt:new Date().toISOString()}, null, 2)))) };
  const cur = await fetch('https://api.github.com/repos/Simzy420/big-brain-ape-dashboard/contents/corrigo-actions.json', { headers:{ Authorization:'token '+token } });
  if (cur.ok) { const info = await cur.json(); if (info.sha) body.sha = info.sha; }
  const res = await fetch('https://api.github.com/repos/Simzy420/big-brain-ape-dashboard/contents/corrigo-actions.json', { method:'PUT', headers:{ Authorization:'token '+token, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) alert('Saved on the phone. GitHub did not take the pickup file.');
  else alert('Sent for Corrigo pickup.');
}
function saveToken(){
  const token = document.getElementById('token').value.trim();
  if (!token) return;
  localStorage.setItem('github_token', token);
  document.getElementById('token').value = '';
  render();
  alert('Token saved on this phone.');
}
async function loadJobs(){
  const res = await fetch('work-orders.json?v=' + Date.now());
  const jobs = await res.json();
  let inbox = getData('corrigo_inbox');
  const seen = handled();
  jobs.forEach(w => { if (!seen.has(String(w.number))) inbox.unshift(w); });
  saveData('corrigo_inbox', inbox);
  render();
}
loadJobs();
</script>
</body>
</html>
