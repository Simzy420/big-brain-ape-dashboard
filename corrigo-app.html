<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sims Construction — Work Orders</title>
<style>
body { margin:0; background:#0f0f17; color:#fff; font-family:-apple-system,sans-serif; }
header { padding:16px; background:linear-gradient(135deg,#0099ff,#00cc66); position:sticky; top:0; }
h1 { margin:0; font-size:24px; }
.tabs { display:flex; gap:8px; overflow:auto; padding:12px; }
.tab { background:#1c1c2e; border:0; color:#fff; border-radius:12px; padding:12px 14px; font-size:18px; font-weight:700; }
.wrap { padding:12px; }
.card { background:#1c1c2e; border-radius:16px; padding:16px; margin-bottom:12px; }
button.big { width:100%; border:0; border-radius:12px; padding:16px; font-size:22px; font-weight:800; color:#fff; margin-top:8px; }
.accept { background:#00cc66; }
.decline { background:#ff3b30; }
.card strong { font-size: 25px; }
.card .wo-est {
  font-size: 26px;
  font-weight: 800;
  color: #00cc66;
  white-space: nowrap;
}
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-row button { flex: 1; }
.card .wo-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card p { font-size: 23px; line-height: 1.4; }
.email-btn {
  display: block;
  width: 100%;
  background: rgba(0,153,255,0.15);
  border: 1px solid #0099ff;
  color: #0099ff;
  border-radius: 12px;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  margin-top: 8px;
  cursor: pointer;
}
.email-btn:active { background: rgba(0,153,255,0.3); }
.email-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 999;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
  padding: 20px;
}
.email-modal.show { display: flex; }

/* FIELD ROW */
.field-row { display: flex; gap: 12px; }
.field-row .field { flex: 1; }

/* LINE ITEMS */
.line-item {
  background: #1c1c2e;
  border: 2px solid #333;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}
.line-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.line-item-header h4 {
  font-size: 20px;
  font-weight: 700;
  color: #0099ff;
  margin: 0;
}
.line-item-remove {
  background: #ff3b30;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}
.line-item .field { margin-bottom: 10px; }
.line-item .field label { font-size: 16px; }
.line-item .field input { font-size: 20px; padding: 12px; }
.line-item .field select { font-size: 20px; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 12px; border: 0; }

/* ADD ITEM BUTTON */
.add-item-btn {
  background: transparent;
  border: 2px dashed #0099ff;
  color: #0099ff;
  border-radius: 12px;
  padding: 16px;
  font-size: 22px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
}

/* PHOTO BUTTONS */
.photo-buttons { display: flex; gap: 12px; }
.photo-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: #1c1c2e;
  border: 3px solid #333;
  border-radius: 14px;
  padding: 24px 12px;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
}
.photo-btn:active { border-color: #0099ff; background: rgba(0,153,255,0.1); }
.photo-btn-icon { font-size: 40px; }
.photo-preview {
  width: 100%;
  border-radius: 12px;
  margin-top: 12px;
  display: none;
}
.photo-preview.show { display: block; }
.photo-filename {
  font-size: 18px;
  color: #00cc66;
  margin-top: 8px;
}

.save { background:#0099ff; }
input { width:100%; box-sizing:border-box; font-size:20px; padding:14px; border-radius:12px; border:0; }
.muted { color:#aaa; font-size:16px; }
</style>
</head>
<body>
<header><h1>Sims Construction</h1><p>Work orders</p></header>
<div class="tabs">
  <button class="tab" onclick="show('inbox')">Inbox <span id="inboxCount">0</span></button>
  <button class="tab" onclick="show('accepted')">Accepted <span id="acceptedCount">0</span></button>
  <button class="tab" onclick="show('declined')">Declined <span id="declinedCount">0</span></button>
  <button class="tab" onclick="show('bidding')">Bidding <span id="biddingCount">0</span></button>
  <button class="tab" onclick="show('almostdue')">⚠️ Almost Due <span id="almostDueCount">0</span></button>
  <button class="tab" onclick="show('overdue')">⏰ Overdue <span id="overdueCount">0</span></button>
  <button class="tab" onclick="show('new')">💰 Complete</button>
  <button class="tab" onclick="show('settings')">Settings</button>
</div>
<div class="wrap">
  <div id="inbox"></div>
  <div id="accepted" style="display:none"></div>
  <div id="declined" style="display:none"></div>
  <div id="bidding" style="display:none"></div>
  <div id="almostdue" style="display:none"></div>
  <div id="overdue" style="display:none"></div>
  <div id="new" style="display:none">
    <div class="card">
      <h2 style="margin:0 0 8px 0;">💵 Labor & Materials</h2>
      <div id="lineItems"></div>
      <button class="add-item-btn" onclick="addLineItem()">+ Add Labor or Material</button>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px 0;">📸 Job Photo</h2>
      <div class="photo-buttons">
        <button class="photo-btn" onclick="document.getElementById('photoInputCamera').click()">
          <span class="photo-btn-icon">📷</span>
          <span>Take Photo</span>
        </button>
        <button class="photo-btn" onclick="document.getElementById('photoInputGallery').click()">
          <span class="photo-btn-icon">🖼️</span>
          <span>Choose from Photos</span>
        </button>
      </div>
      <input type="file" id="photoInputCamera" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
      <input type="file" id="photoInputGallery" accept="image/*" style="display:none" onchange="handlePhoto(this)">
      <img class="photo-preview" id="photoPreview">
      <div class="photo-filename" id="photoFilename"></div>
    </div>

    <button class="big save" onclick="generateSummary()">✅ Generate Summary</button>
    <div style="height:12px"></div>
    <button class="big decline" onclick="clearForm()">🗑️ Clear Form</button>
  </div>

  <div id="settings" style="display:none">
    <div class="card">
      <p class="muted">Paste the GitHub token once. It stays on this phone.</p>
      <input id="token" type="password" placeholder="ghp_...">
      <button class="big save" onclick="saveToken()">Save Token</button>
      <p id="status" class="muted"></p>
    </div>
  </div>
</div>

<!-- BID MODAL -->
<div id="bidModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:999; align-items:center; justify-content:center;">
  <div class="card" style="max-width:400px; margin:auto;">
    <h2 style="margin:0 0 12px 0;">🔨 Enter Bid Amount</h2>
    <p class="muted">How much will you quote for this job?</p>
    <input id="bidAmount" type="number" placeholder="0.00" step="0.01" inputmode="decimal">
    <input id="bidWoId" type="hidden">
    <button class="big accept" onclick="submitBid()">✅ Submit Bid</button>
    <button class="big decline" onclick="closeBidModal()" style="margin-top:8px;">Cancel</button>
  </div>
</div>
<!-- WORK DESCRIPTION MODAL -->
<div class="email-modal" id="workDescModal" onclick="if(event.target===this)closeWorkDescModal()">
  <div class="card" style="width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;margin:auto;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;">
      <h2 style="margin:0;">📝 Work Description</h2>
      <button onclick="closeWorkDescModal()" style="background:#1c1c2e;border:none;color:#fff;font-size:28px;width:44px;height:44px;border-radius:50%;cursor:pointer;flex-shrink:0;">✕</button>
    </div>
    <p style="color:#aaa;font-size:20px;margin-bottom:12px;flex-shrink:0;">What did you do at this job?</p>
    <input id="workDescWoId" type="hidden">
    <textarea id="workDescText" style="width:100%;font-size:22px;padding:14px;border-radius:12px;border:0;background:#0f0f17;color:#fff;min-height:200px;flex:1;resize:none;-webkit-overflow-scrolling:touch;" placeholder="Describe the work you did..."></textarea>
    <button class="big save" onclick="saveWorkDesc()" style="margin-top:12px;flex-shrink:0;">💾 Save Description</button>
  </div>
</div>

<!-- EMAIL MODAL -->
<div class="email-modal" id="emailModal" onclick="if(event.target===this)closeEmailModal()">
  <div class="card" style="width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column;margin:auto;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-shrink:0;">
      <h2 style="margin:0;">📧 Original Email</h2>
      <button onclick="closeEmailModal()" style="background:#1c1c2e;border:none;color:#fff;font-size:28px;width:44px;height:44px;border-radius:50%;cursor:pointer;flex-shrink:0;">✕</button>
    </div>
    <div id="emailModalSubject" style="color:#aaa;font-size:20px;margin-bottom:12px;border-bottom:1px solid #1c1c2e;padding-bottom:12px;flex-shrink:0;"></div>
    <div id="emailModalBody" style="white-space:pre-wrap;font-size:18px;line-height:1.6;overflow-y:auto;flex:1;color:#fff;-webkit-overflow-scrolling:touch;"></div>
  </div>
</div>

<script>
let currentPhoto = null;
let lineItemCount = 0;
function getData(k){ try { return JSON.parse(localStorage.getItem(k)||'[]'); } catch(e){ return []; } }
function saveData(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function handled(){
  const nums = new Set();
  ['corrigo_inbox','corrigo_accepted','corrigo_declined'].forEach(k => getData(k).forEach(w => nums.add(String(w.number))));
  return nums;
}
function show(name){
  ['inbox','accepted','declined','bidding','almostdue','overdue','new','settings'].forEach(id => document.getElementById(id).style.display = id===name ? 'block' : 'none');
  if (name==='inbox') render();
  if (name==='accepted') render();
  if (name==='declined') render();
  if (name==='bidding') render();
  if (name==='almostdue') render();
  if (name==='overdue') render();
  if (name==='saved') render();
}
function render(){
  const inbox = getData('corrigo_inbox');
  const accepted = getData('corrigo_accepted');
  const declined = getData('corrigo_declined');
  const bidding = getData('corrigo_bidding');
  document.getElementById('inboxCount').textContent = inbox.length;
  document.getElementById('acceptedCount').textContent = accepted.length;
  document.getElementById('declinedCount').textContent = declined.length;
  document.getElementById('biddingCount').textContent = bidding.length;
  document.getElementById('inbox').innerHTML = inbox.map(w => card(w,true)).join('') || '<div class="card">No jobs in inbox.</div>';
  document.getElementById('accepted').innerHTML = accepted.map(w => card(w,false)).join('') || '<div class="card">Nothing accepted yet.</div>';
  document.getElementById('declined').innerHTML = declined.map(w => card(w,false)).join('') || '<div class="card">Nothing declined.</div>';
  document.getElementById('bidding').innerHTML = bidding.map(w => card(w,false)).join('') || '<div class="card">No bids submitted.</div>';
  const saved = getData('corrigo_saved');
  document.getElementById('savedCount').textContent = saved.length;
  document.getElementById('saved').innerHTML = saved.map(w => card(w,true)).join('') || '<div class="card">Nothing saved yet.</div>';
  const now = new Date();
  const sevenDays = new Date(now.getTime() + 7*24*60*60*1000);
  const overdueList = [];
  const almostDueList = [];
  accepted.forEach(w => {
    if (w.dueDate) {
      const due = new Date(w.dueDate);
      if (due < now) overdueList.push(w);
      else if (due <= sevenDays) almostDueList.push(w);
    }
  });
  // Also check inbox items
  inbox.forEach(w => {
    if (w.dueDate) {
      const due = new Date(w.dueDate);
      if (due < now) overdueList.push(w);
      else if (due <= sevenDays) almostDueList.push(w);
    }
  });
  document.getElementById('overdueCount').textContent = overdueList.length;
  document.getElementById('almostDueCount').textContent = almostDueList.length;
  document.getElementById('overdue').innerHTML = overdueList.map(w => card(w,false)).join('') || '<div class="card">Nothing overdue. ✅</div>';
  document.getElementById('almostdue').innerHTML = almostDueList.map(w => card(w,false)).join('') || '<div class="card">Nothing due in the next 7 days.</div>';
  const token = localStorage.getItem('github_token');
  document.getElementById('status').textContent = token ? 'Token saved on this phone.' : 'No token saved yet.';
}
function card(w, canAct){
  const estDisplay = w.estimatedAmount ? '$' + parseFloat(w.estimatedAmount).toFixed(2) : '';
  const estHtml = estDisplay ? `<div class="wo-est">${estDisplay}</div>` : '';
  let loc = w.location || '';
  let desc = w.description || '';
  if (!loc && w.emailContent) {
    // Only try to extract from real work order emails, not invoice emails
    if (!w.emailContent.toLowerCase().includes('invoice') || !w.emailContent.includes('has been Authorized')) {
      const m = w.emailContent.match(/([\d]+\s+[^,]+,\s+[A-Z]+,?\s+\d{5}[^\n]*)/);
      if (m) loc = m[1].trim();
    }
  }
  if (!desc && w.emailContent) {
    // Skip invoice emails - they have no job description
    if (w.emailContent.toLowerCase().includes('invoice') && w.emailContent.includes('has been Authorized')) {
      desc = 'Invoice authorized - no job description available';
    } else {
      const lines = w.emailContent.split('\n').filter(l => l.trim() && !l.includes('CorrigoPro') && !l.includes('mailto:') && !l.includes('Sims Construction') && !l.includes('alerts@') && !l.includes('garysims') && !l.includes('Sent:') && !l.includes('From:') && !l.includes('To:') && !l.includes('Subject:') && !l.includes('Monrovia') && !l.includes('Reykjavik'));
      desc = lines.slice(0, 3).join(' ').substring(0, 200);
    }
  }
  const actionBtns = canAct ? `<div class="btn-row"><button class="big accept" onclick="choose('${w.id}','accept')">Accept</button><button class="big decline" onclick="choose('${w.id}','decline')">Decline</button></div><div class="btn-row"><button class="big save" onclick="openBidModal('${w.id}')" style="margin-top:0;">🔨 Bid</button><button class="big save" onclick="saveWo('${w.id}')" style="margin-top:0;background:#666;">💾 Save for Later</button></div>` : `<div class="btn-row"><button class="big decline" onclick="unaccept('${w.id}')" style="background:#f44336;">↩ Unaccept</button></div><p class="muted">Waiting for Corrigo pickup</p>`;
  const workDescBtn = `<button class="email-btn" style="border-color:#ff9500;color:#ff9500;background:rgba(255,149,0,0.15);" onclick="openWorkDesc('${w.id}')">📝 Add Work Description</button>`;
  const emailBtn = w.emailContent ? `<button class="email-btn" onclick="viewEmail('${w.id}')">📧 View Original Email</button>` : '';
  const extraBtns = `<div class="btn-row">${workDescBtn}${emailBtn}</div>`;
  return `<div class="card"><div class="wo-card-header"><strong>${w.number||''}</strong>${estHtml}</div>${loc ? '<p>'+loc+'</p>' : ''}${desc ? '<p>'+desc+'</p>' : ''}${actionBtns}${extraBtns}</div>`;
}
function choose(id, action){
  let inbox = getData('corrigo_inbox');
  const idx = inbox.findIndex(w => w.id===id);
  if (idx<0) return;
  const wo = inbox[idx];
  wo.status = action==='accept' ? 'accepted' : 'declined';
  inbox.splice(idx,1);
  saveData('corrigo_inbox', inbox);
  const key = action==='accept' ? 'corrigo_accepted' : 'corrigo_declined';
  const arr = getData(key);
  arr.unshift(wo);
  saveData(key, arr);
  render();
  show(action==='accept' ? 'accepted' : 'declined');
  sendPickup();
}

function unaccept(id){
  let accepted = getData('corrigo_accepted');
  const idx = accepted.findIndex(w => w.id===id);
  if (idx<0) return;
  const wo = accepted[idx];
  wo.status = 'inbox';
  accepted.splice(idx,1);
  saveData('corrigo_accepted', accepted);
  let inbox = getData('corrigo_inbox');
  inbox.unshift(wo);
  saveData('corrigo_inbox', inbox);
  render();
  show('inbox');
  sendPickup();
}

function openBidModal(id){
  document.getElementById('bidWoId').value = id;
  document.getElementById('bidAmount').value = '';
  document.getElementById('bidModal').style.display = 'flex';
}

function closeBidModal(){
  document.getElementById('bidModal').style.display = 'none';
}

function submitBid(){
  const id = document.getElementById('bidWoId').value;
  const amount = document.getElementById('bidAmount').value.trim();
  if (!amount || parseFloat(amount) <= 0){
    alert('Enter a valid bid amount.');
    return;
  }
  let inbox = getData('corrigo_inbox');
  const idx = inbox.findIndex(w => w.id===id);
  if (idx<0) return;
  const wo = inbox[idx];
  wo.status = 'bidding';
  wo.bidAmount = parseFloat(amount);
  inbox.splice(idx,1);
  saveData('corrigo_inbox', inbox);
  const arr = getData('corrigo_bidding');
  arr.unshift(wo);
  saveData('corrigo_bidding', arr);
  closeBidModal();
  render();
  show('bidding');
  sendPickup();
}
async function sendPickup(){
  const token = localStorage.getItem('github_token');
  if (!token) { alert('Saved on this phone. Paste the token in Settings so it can be picked up.'); return; }
  const actions = [];
  getData('corrigo_accepted').forEach(w => actions.push({number:w.number, action:'accept', location:w.location||'', description:w.description||''}));
  getData('corrigo_declined').forEach(w => actions.push({number:w.number, action:'decline', location:w.location||'', description:w.description||''}));
  getData('corrigo_accepted').forEach(w => actions.push({number:w.number, action:'accept', location:w.location||'', description:w.description||'', workDescription:w.workDescription||''}));
  getData('corrigo_declined').forEach(w => actions.push({number:w.number, action:'decline', location:w.location||'', description:w.description||''}));
  getData('corrigo_bidding').forEach(w => actions.push({number:w.number, action:'bid', bidAmount:w.bidAmount||0, location:w.location||'', description:w.description||''}));
  getData('corrigo_saved').forEach(w => { if (w.workDescription) actions.push({number:w.number, action:'update', workDescription:w.workDescription, location:w.location||'', description:w.description||''}); });
  const body = { message:'Pickup from phone app', content: btoa(unescape(encodeURIComponent(JSON.stringify({pendingActions:actions, exportedAt:new Date().toISOString()}, null, 2)))) };
  const cur = await fetch('https://api.github.com/repos/Simzy420/big-brain-ape-dashboard/contents/corrigo-actions.json', { headers:{ Authorization:'token '+token } });
  if (cur.ok) { const info = await cur.json(); if (info.sha) body.sha = info.sha; }
  const res = await fetch('https://api.github.com/repos/Simzy420/big-brain-ape-dashboard/contents/corrigo-actions.json', { method:'PUT', headers:{ Authorization:'token '+token, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) alert('Saved on the phone. GitHub did not take the pickup file.');
  else alert('Sent for Corrigo pickup.');
}

// ============ LINE ITEMS ============
function addLineItem(type) {
  lineItemCount++;
  const div = document.createElement('div');
  div.className = 'line-item';
  div.id = 'item' + lineItemCount;
  div.innerHTML = `
    <div class="line-item-header">
      <h4 id="item${lineItemCount}Title">${type || 'Labor'} Item</h4>
      <button class="line-item-remove" onclick="removeLineItem(${lineItemCount})">✕ Remove</button>
    </div>
    <div class="field">
      <label>Type</label>
      <select id="item${lineItemCount}Type" onchange="updateItemTitle(${lineItemCount})">
        <option value="Labor" ${type==='Labor'?'selected':''}>Labor (Hours)</option>
        <option value="Material" ${type==='Material'?'selected':''}>Material</option>
      </select>
    </div>
    <div class="field-row">
      <div class="field">
        <label id="item${lineItemCount}QtyLabel">Hours</label>
        <input type="number" id="item${lineItemCount}Qty" placeholder="0" step="0.5" inputmode="decimal">
      </div>
      <div class="field">
        <label>Rate / Price</label>
        <input type="number" id="item${lineItemCount}Rate" placeholder="0.00" step="0.01" inputmode="decimal">
      </div>
    </div>
  `;
  document.getElementById('lineItems').appendChild(div);
  updateItemTitle(lineItemCount);
}

function updateItemTitle(id) {
  const type = document.getElementById('item' + id + 'Type').value;
  document.getElementById('item' + id + 'Title').textContent = type + ' Item';
  document.getElementById('item' + id + 'QtyLabel').textContent = type === 'Labor' ? 'Hours' : 'Quantity';
}

function removeLineItem(id) {
  document.getElementById('item' + id).remove();
}

// ============ PHOTO ============
function handlePhoto(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('photoPreview').src = e.target.result;
      document.getElementById('photoPreview').classList.add('show');
      document.getElementById('photoFilename').textContent = '✅ Photo attached: ' + file.name;
      currentPhoto = { name: file.name, data: e.target.result };
    };
    reader.readAsDataURL(file);
  }
}

// ============ GENERATE SUMMARY ============
function generateSummary() {
  let summary = '';
  let total = 0;
  for (let i = 1; i <= lineItemCount; i++) {
    const el = document.getElementById('item' + i);
    if (!el) continue;
    const type = document.getElementById('item' + i + 'Type').value;
    const qty = parseFloat(document.getElementById('item' + i + 'Qty').value) || 0;
    const rate = parseFloat(document.getElementById('item' + i + 'Rate').value) || 0;
    const lineTotal = qty * rate;
    total += lineTotal;
    const qtyLabel = type === 'Labor' ? 'hrs' : 'qty';
    summary += `${type}: ${qty} ${qtyLabel} x $${rate.toFixed(2)} = $${lineTotal.toFixed(2)}\n`;
  }
  summary += `\nTOTAL: $${total.toFixed(2)}`;
  if (currentPhoto) summary += `\nPhoto: ${currentPhoto.name}`;
  alert(summary);
}

// ============ CLEAR FORM ============
function clearForm() {
  document.getElementById('lineItems').innerHTML = '';
  lineItemCount = 0;
  currentPhoto = null;
  document.getElementById('photoPreview').classList.remove('show');
  document.getElementById('photoPreview').src = '';
  document.getElementById('photoFilename').textContent = '';
  addLineItem('Labor');
}

function openWorkDesc(id){
  document.getElementById('workDescWoId').value = id;
  // Load existing description if any
  const allWos = [].concat(
    getData('corrigo_inbox'),
    getData('corrigo_accepted'),
    getData('corrigo_declined'),
    getData('corrigo_bidding'),
    getData('corrigo_saved')
  );
  const wo = allWos.find(w => w.id === id);
  document.getElementById('workDescText').value = (wo && wo.workDescription) || '';
  document.getElementById('workDescModal').classList.add('show');
}

function closeWorkDescModal(){
  document.getElementById('workDescModal').classList.remove('show');
}

function saveWorkDesc(){
  const id = document.getElementById('workDescWoId').value;
  const desc = document.getElementById('workDescText').value.trim();
  // Find the work order in all tabs and save the description
  const allTabs = ['corrigo_inbox','corrigo_accepted','corrigo_declined','corrigo_bidding','corrigo_saved'];
  for (const tab of allTabs) {
    const arr = getData(tab);
    const idx = arr.findIndex(w => w.id === id);
    if (idx >= 0) {
      arr[idx].workDescription = desc;
      saveData(tab, arr);
      break;
    }
  }
  closeWorkDescModal();
  alert('✅ Work description saved!');
}

function saveWo(id){
  // Check all tabs for this work order
  const allTabs = ['corrigo_inbox','corrigo_accepted','corrigo_declined','corrigo_bidding','corrigo_saved'];
  for (const tab of allTabs) {
    const arr = getData(tab);
    const idx = arr.findIndex(w => w.id === id);
    if (idx >= 0) {
      const wo = arr[idx];
      wo.status = 'saved';
      arr.splice(idx, 1);
      saveData(tab, arr);
      const saved = getData('corrigo_saved');
      saved.unshift(wo);
      saveData('corrigo_saved', saved);
      render();
      show('saved');
      return;
    }
  }
}

function viewEmail(id){
  const allWos = [].concat(
    getData('corrigo_inbox'),
    getData('corrigo_accepted'),
    getData('corrigo_declined'),
    getData('corrigo_bidding')
  );
  const wo = allWos.find(w => w.id === id);
  if (!wo) { alert('Could not find work order'); return; }
  if (!wo.emailContent) { alert('No email saved for this work order'); return; }
  document.getElementById('emailModalSubject').textContent = wo.emailSubject || '(no subject)';
  document.getElementById('emailModalBody').textContent = wo.emailContent;
  document.getElementById('emailModal').classList.add('show');
}

function closeEmailModal(){
  document.getElementById('emailModal').classList.remove('show');
}

function saveToken(){
  const token = document.getElementById('token').value.trim();
  if (!token) return;
  localStorage.setItem('github_token', token);
  document.getElementById('token').value = '';
  render();
  alert('Token saved on this phone.');
}
async function loadJobs(){
  const res = await fetch('work-orders.json?v=' + Date.now());
  const jobs = await res.json();
  let inbox = getData('corrigo_inbox');
  const seen = handled();
  jobs.forEach(w => { if (!seen.has(String(w.number))) inbox.unshift(w); });
  saveData('corrigo_inbox', inbox);
  render();
}
loadJobs();
</script>
