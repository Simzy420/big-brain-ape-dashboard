<!DOCTYPE html>
<html>
<head>
<title>Gmail OAuth - Sims Construction</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
h1 { font-size: 24px; }
button { background: #4285f4; color: white; border: none; padding: 16px 32px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%; margin: 20px 0; }
button:hover { background: #3367d6; }
.code-box { background: #f5f5f5; padding: 16px; border-radius: 8px; word-break: break-all; font-family: monospace; font-size: 14px; border: 2px solid #4285f4; }
.copy-btn { background: #34a853; font-size: 16px; padding: 12px 24px; }
.note { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h1>📧 Gmail Re-Authorize</h1>
<p>This lets the Corrigo work order app read your Gmail for new work orders.</p>

<div id="step1">
<button onclick="authorize()">Authorize Gmail Access</button>
<p class="note">Tap the button, sign in to Google, and allow access. You'll come back here with a code.</p>
</div>

<div id="step2" style="display:none">
<h2>✅ Authorized!</h2>
<p>Copy this code and paste it to the bot:</p>
<div class="code-box" id="authCode"></div>
<button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
</div>

<div id="stepError" style="display:none">
<h2>❌ Error</h2>
<p id="errorMsg"></p>
</div>

<script>
const CLIENT_ID = '951464577684-ka8uohjksoee9hg82juhm656hg4birha.apps.googleusercontent.com';
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPE = 'https://www.googleapis.com/auth/gmail.readonly';

function authorize() {
  const authUrl = 'https://accounts.google.com/o/oauth2/auth?' + new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    scope: SCOPE,
    response_type: 'code',
    access_type: 'offline',
    prompt: 'consent'
  });
  window.location.href = authUrl;
}

// Check if we came back with a code
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
const error = params.get('error');

if (code) {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('authCode').textContent = code;
  // Clean URL
  window.history.replaceState({}, '', window.location.pathname);
} else if (error) {
  document.getElementById('step1').style.display = 'none';
  document.getElementById('stepError').style.display = 'block';
  document.getElementById('errorMsg').textContent = error;
}

function copyCode() {
  navigator.clipboard.writeText(document.getElementById('authCode').textContent).then(() => {
    document.querySelector('.copy-btn').textContent = '✅ Copied!';
  });
}
</script>
</body>
</html>
