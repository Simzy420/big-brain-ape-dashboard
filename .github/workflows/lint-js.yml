name: Lint JavaScript in HTML

on:
  push:
    paths:
      - 'app35.html'
  pull_request:
    paths:
      - 'app35.html'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS brace balance and syntax
        run: |
          set -e
          node -e '
          const fs = require("fs");
          const html = fs.readFileSync("app35.html", "utf8");
          
          // Extract all script blocks
          const re = /<script[^>]*>([\s\S]*?)<\/script>/g;
          let m, js = "", idx = 0;
          while ((m = re.exec(html)) !== null) {
            js += m[1] + "\n;\n";
            idx++;
          }
          console.log("Found " + idx + " script blocks, " + js.length + " chars total");
          
          // String-aware brace counter
          let depth = 0;
          let inStr = false, strChar = "";
          let inBlockComment = false, inLineComment = false;
          let errors = [];
          
          for (let i = 0; i < js.length; i++) {
            const c = js[i];
            const nxt = js[i+1] || "";
            
            if (inLineComment) {
              if (c === "\n") inLineComment = false;
            } else if (inBlockComment) {
              if (c === "*" && nxt === "/") { inBlockComment = false; i++; }
            } else if (inStr) {
              if (c === "\\") i++;
              else if (c === strChar) inStr = false;
            } else {
              if (c === "/" && nxt === "/") { inLineComment = true; i++; }
              else if (c === "/" && nxt === "*") { inBlockComment = true; i++; }
              else if (c === "'" || c === "\"" || c === "`") { inStr = true; strChar = c; }
              else if (c === "{") depth++;
              else if (c === "}") depth--;
            }
          }
          
          console.log("Final brace depth: " + depth);
          
          // depth=0: perfectly balanced
          // depth=1: known pattern (one unclosed function, browser auto-closes) — OK
          // depth>1: MISSING closing brace inside a function — FAIL
          // depth<0: EXTRA closing brace — FAIL
          if (depth > 1) {
            console.error("FAIL: Brace depth is " + depth + " — missing " + depth + " closing brace(s). This will break the app.");
            process.exit(1);
          }
          if (depth < 0) {
            console.error("FAIL: Brace depth is " + depth + " — extra closing brace(s). This will break the app.");
            process.exit(1);
          }
          if (depth === 1) {
            console.log("WARN: One unclosed function (known pattern, browser auto-closes). OK but should be fixed eventually.");
          }
          if (depth === 0) {
            console.log("OK: All braces balanced.");
          }
          
          console.log("\nBrace check passed.");
          '
