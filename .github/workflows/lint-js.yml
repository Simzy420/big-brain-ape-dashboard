name: Lint JavaScript in HTML

on:
  push:
    paths:
      - 'app35.html'
  pull_request:
    paths:
      - 'app35.html'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS brace balance and syntax
        run: node .github/workflows/lint.js
