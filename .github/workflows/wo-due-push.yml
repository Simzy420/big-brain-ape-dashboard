name: Work order due reminders

on:
  schedule:
    # 8:00 AM America/Boise. Boise is MDT (UTC-6) or MST (UTC-7).
    # The script sends only when the Boise clock says 8 AM, so the other run exits.
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test pings every subscribed phone; daily sends reminders that are due'
        type: choice
        options:
          - test
          - daily
        default: test

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install push sender
        working-directory: push-api
        run: npm ci
      - name: Send reminders
        working-directory: push-api
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:caseysims463@yahoo.com
          PUSH_API_URL: ${{ secrets.PUSH_API_URL }}
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'daily' }}
          IGNORE_HOUR: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node send-due.js
